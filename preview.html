  <style>
    .preview-layout {
      min-height: 100vh;
      background: var(--app-bg);
      transition: background 0.3s ease;
    }
    
    .preview-layout:has(.theme-luxe-noir) {

    }

    }

    }

    }

    .preview-layout:has(.theme-sakura) {
      background: #FAFAF8 !important;
    }

    .preview-layout:has(.theme-neon) {
      background: #0E0B18 !important;
    }

    .preview-layout:has(.theme-verdant) {
      background: #F3F0E8 !important;
    }

    .preview-layout:has(.theme-copper) {
      background: #2E2C2A !important;
    }

    .preview-layout:has(.theme-riviera) {
      background: #F8F4EE !important;
    }

    .preview-layout:has(.theme-blueprint) {

    .preview-controls {

    /* QR panel */

  <script type="module">
    import { initApp, state, toast, confirm, navigateTo, setTheme } from './js/app.js';
    import authManager from './js/auth.js';
    import db from './js/db.js';
    import { localStore, escapeHtml } from './js/utils/helpers.js';
    import MenuRenderer from './js/preview/renderer.js';
    import ExportManager from './js/preview/export.js';
    import QRGenerator from './js/preview/qr.js';

    // Helper to get hotel slug from subdomain
    function getHotelSlugFromHostname() {
      const hostname = window.location.hostname;
      const baseDomain = 'menuforgee.vercel.app';
      if (hostname.endsWith('.' + baseDomain)) {
        return hostname.substring(0, hostname.length - baseDomain.length - 1);
      }
      if (hostname.includes('.localhost') || hostname.startsWith('127.0.0.1')) {
        const parts = hostname.split('.');
        if (parts.length > 1 && parts[0] !== 'www' && parts[0] !== 'localhost') {
          return parts[0];
        }
      }
      return null;
    }

    const hostSlug = getHotelSlugFromHostname();

    // URL params
    const params = new URLSearchParams(window.location.search);
    const menuId = params.get('id');
    const isGuest = params.get('guest') === 'true' || !!hostSlug;
    const mode = params.get('mode'); // 'print', 'png'
    const autoPrint = params.get('auto') === 'true';
    const hotelIdParam = params.get('hotelId');

    if (!menuId && !hotelIdParam && !hostSlug) {
      navigateTo('dashboard.html');
    }

    if (isGuest) {
      document.getElementById('preview-layout').classList.add('guest-mode');
    }

    const renderer = new MenuRenderer();
    let menuData = null;
    let originalHtml = '';
    let hotelSubdomain = hostSlug || '';

    function paginateMenu(container) {
      if (!container) return;
      
      const pages = Array.from(container.querySelectorAll('.menu-page'));
      if (pages.length === 0) return;
      
      const isDigital = pages[0].classList.contains('menu-page--digital');
      if (isDigital) return; // Digital layout is a continuous scroll, no pagination needed.
      
      let pageIndex = 0;
      while (pageIndex < pages.length) {
        const page = pages[pageIndex];
        const maxHeight = page.offsetHeight || 1123; // fallback to A4 height in px
        
        const children = Array.from(page.children).filter(el => {
          return !el.classList.contains('menu-footer') && !el.classList.contains('page-break');
        });
        
        let splitIndex = -1;
        let itemSplitSection = null;
        let itemSplitIndex = -1;
        
        for (let i = 0; i < children.length; i++) {
          const child = children[i];
          const bottom = child.offsetTop + child.offsetHeight;
          
          if (bottom > maxHeight) {
            if (i === 0) {
              // The first section itself overflows. Let's try splitting its items.
              const items = Array.from(child.querySelectorAll('.menu-item'));
              for (let j = 0; j < items.length; j++) {
                const item = items[j];
                const itemBottom = child.offsetTop + item.offsetTop + item.offsetHeight;
                if (itemBottom > maxHeight) {
                  if (j > 0) {
                    itemSplitSection = child;
                    itemSplitIndex = j;
                  }
                  break;
                }
              }
            }
            splitIndex = i;
            break;
          }
        }
        
        if (splitIndex !== -1) {
          const newPage = page.cloneNode(false); // empty clone of page
          const footer = page.querySelector('.menu-footer');
          
          if (itemSplitSection && itemSplitIndex > 0) {
            // Split category items
            const currentSection = itemSplitSection;
            const newSection = currentSection.cloneNode(true);
            
            // Remove divider and title modifications on split page for clean flow
            const newDivider = newSection.querySelector('.section-divider');
            if (newDivider) newDivider.remove();
            
            const newTitle = newSection.querySelector('.section-title');
            if (newTitle) {
              newTitle.textContent = newTitle.textContent + ' (Cont.)';
            }
            
            const newSubtitle = newSection.querySelector('.section-subtitle');
            if (newSubtitle) newSubtitle.remove();
            
            // Keep items 0..j-1 on current section
            const currentItems = Array.from(currentSection.querySelectorAll('.menu-item'));
            const newItems = Array.from(newSection.querySelectorAll('.menu-item'));
            
            // Remove items from new section that remain on current page
            for (let k = 0; k < itemSplitIndex; k++) {
              newItems[k].remove();
            }
            // Remove items from current section that move to new page
            for (let k = itemSplitIndex; k < currentItems.length; k++) {
              currentItems[k].remove();
            }
            
            newPage.appendChild(newSection);
            
            // Move all subsequent sections
            const sectionsToMove = children.slice(1);
            sectionsToMove.forEach(sec => newPage.appendChild(sec));
          } else {
            // Split at section boundary
            const sectionsToMove = children.slice(splitIndex);
            sectionsToMove.forEach(sec => newPage.appendChild(sec));
          }
          
          if (footer) {
            newPage.appendChild(footer);
          }
          
          page.parentNode.insertBefore(newPage, page.nextSibling);
          pages.splice(pageIndex + 1, 0, newPage);
        }
        
        pageIndex++;
      }
    }

    function updatePreviewLayout() {
      const container = document.getElementById('preview-container');
      if (!container || !originalHtml) return;
      
      // Save scroll position
      const scrollPos = window.scrollY;
      
      // Restore original unpaginated HTML
      container.innerHTML = originalHtml;
      
      // Defer measurements until DOM layout is updated and resolved
      requestAnimationFrame(() => {
        const isMobileScreen = window.innerWidth <= 768;
        const isPhonePreview = container.classList.contains('device-frame--phone');
        const isDigital = container.querySelector('.menu-page--digital');
        
        if (!isMobileScreen && !isPhonePreview && !isDigital) {
          // Enforce pagination
          paginateMenu(container);
        }
        
        // Restore scroll position
        window.scrollTo(0, scrollPos);
      });
    }

    function updateSplashFromPortalData(portalData) {
      if (!portalData) return;
      const logoContainer = document.getElementById('app-splash-logo-container');
      const nameEl = document.getElementById('app-splash-name');
      
      if (portalData.hotelLogo && logoContainer) {
        logoContainer.innerHTML = `<img src="${portalData.hotelLogo}" alt="${portalData.hotelName || 'Hotel'} Logo" style="max-height:80px; max-width:200px; height:auto; width:auto; object-fit:contain; animation:app-pulse 1.5s infinite ease-in-out;">`;
      } else if (logoContainer) {
        logoContainer.innerHTML = `
          <div style="width:70px; height:70px; border-radius:50%; border:1px solid rgba(201, 169, 110, 0.4); display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg, rgba(201, 169, 110, 0.2) 0%, rgba(0, 0, 0, 0) 100%); animation:app-pulse 1.5s infinite ease-in-out;">
            <span style="font-size:28px; color:#C9A96E;">⚜️</span>
          </div>
        `;
      }
      
      if (portalData.hotelName && nameEl) {
        nameEl.textContent = portalData.hotelName;
      }
    }

    // Apply theme
    const savedTheme = localStore('theme') || 'light';
    setTheme(savedTheme);

    async function loadMenu() {
      try {
        // For guest mode, try public path first
        let data;
        if (isGuest) {
          data = await db.get(`publicMenus/${menuId}`);
        }

        if (!data && !isGuest) {
          const hotelId = state.get('currentHotelId');
          if (hotelId) {
            data = await db.get(`hotels/${hotelId}/menus/${menuId}`);
          }
        }

        if (!data) {
          const container = document.getElementById('preview-container');
          container.innerHTML = `
            <div style="text-align:center;">
              <h2 style="font-size:24px;margin-bottom:8px;">Menu Not Found</h2>
              <p style="color:var(--text-muted);">This menu may have been deleted or is not published yet.</p>
              ${!isGuest ? '<a href="dashboard.html" class="btn btn--primary" style="margin-top:16px;">Back to Dashboard</a>' : ''}
            </div>
          `;
          container.classList.remove('hidden');
          if (window.hideSplashScreen) window.hideSplashScreen();
          return;
        }

        menuData = data;
        
        // Fetch hotel details to show in the splash screen and configure URLs
        const hotelId = data.meta?.hotelId || (isGuest ? null : state.get('currentHotelId'));
        if (hotelId) {
          const portalPath = isGuest ? `publicMenus/hotel_${hotelId}` : `hotels/${hotelId}/info`;
          try {
            const info = await db.get(portalPath);
            if (info) {
              hotelSubdomain = info.subdomain || info.hotelSubdomain || '';
              const mappedData = {
                hotelName: info.hotelName || info.name || 'Our Property',
                hotelLogo: info.hotelLogo || info.logo || null
              };
              updateSplashFromPortalData(mappedData);
            }
          } catch (err) {
            console.error('Failed to prefetch hotel info:', err);
          }

          // Configure admin portal link button
          if (!isGuest) {
            const portalBtn = document.getElementById('btn-go-to-portal');
            if (portalBtn) {
              let resolvedPortalUrl = '';
              const origin = window.location.origin;
              const pathname = window.location.pathname;
              const dir = pathname.substring(0, pathname.lastIndexOf('/'));
              if (hotelSubdomain) {
                let baseDomain = 'menuforgee.vercel.app';
                if (origin.includes('localhost')) {
                  resolvedPortalUrl = `http://${hotelSubdomain}.localhost:5500${dir}/preview.html?guest=true`;
                } else {
                  resolvedPortalUrl = `https://${hotelSubdomain}.${baseDomain}${dir}/preview.html?guest=true`;
                }
              } else {
                resolvedPortalUrl = `${origin}${dir}/preview.html?hotelId=${hotelId}&guest=true`;
              }
              portalBtn.href = resolvedPortalUrl;
              portalBtn.style.display = 'inline-flex';
            }
          }
        }

        document.title = `${data.meta?.name || 'Menu'} — MenuForge`;

        // Render
        originalHtml = renderer.render(data);
        const container = document.getElementById('preview-container');
        container.classList.remove('hidden');
        updatePreviewLayout();

        // QR code
        if (!isGuest) {
          const qrPanel = document.getElementById('qr-panel');
          qrPanel.classList.remove('hidden');

          const shareUrl = QRGenerator.buildMenuUrl(menuId, hotelSubdomain);
          document.getElementById('qr-url').textContent = shareUrl;

          await QRGenerator.renderTo(
            document.getElementById('qr-canvas-wrap'),
            shareUrl,
            { size: 160, colorDark: '#1A1A1A' }
          );
        }

        // Increment view count
        if (data.meta) {
          const hotelId = state.get('currentHotelId');
          if (hotelId) {
            db.update(`hotels/${hotelId}/menus/${menuId}/meta`, {
              viewCount: (data.meta.viewCount || 0) + 1
            }).catch(() => {});
          }
        }

        // Auto-print if requested
        if (autoPrint) {
          setTimeout(() => window.print(), 500);
        }

        // Setup menu switcher if hotelId is available
        if (data.meta?.hotelId) {
          setupGuestSwitcher(data.meta.hotelId, menuId);
        }

        if (window.hideSplashScreen) window.hideSplashScreen();

      } catch (error) {
        console.error('Failed to load menu:', error);
        const container = document.getElementById('preview-container');
        container.innerHTML = `
          <div style="text-align:center;">
            <h2 style="font-size:24px;margin-bottom:8px; color: #FFF;">Error Loading Menu</h2>
            <p style="color:var(--text-muted);">${error.message}</p>
          </div>
        `;
        container.classList.remove('hidden');
        if (window.hideSplashScreen) window.hideSplashScreen();
      }
    }

    async function loadHotelPortal(hotelId) {
      try {
        const portalData = await db.get(`publicMenus/hotel_${hotelId}`);
        if (portalData) {
          updateSplashFromPortalData(portalData);
        }
        const container = document.getElementById('preview-container');
        
        if (!portalData || !portalData.menus || portalData.menus.length === 0) {
          container.innerHTML = `
            <div style="text-align:center; padding: 48px 24px;">
              <h2 style="font-size:24px;margin-bottom:8px; color: #FFF;">No Active Menus</h2>
              <p style="color:var(--text-muted);">This property has not published any menus yet.</p>
            </div>
          `;
          container.classList.remove('hidden');
          if (window.hideSplashScreen) window.hideSplashScreen();
          return;
        }

        // Render the hotel portal
        let logoHtml = '';
        if (portalData.hotelLogo) {
          logoHtml = `<img src="${portalData.hotelLogo}" alt="${portalData.hotelName} Logo" class="portal-luxury-logo">`;
        } else {
          logoHtml = `<span class="portal-luxury-logo-placeholder">⚜️</span>`;
        }

        const menuCards = portalData.menus.map(menu => {
          const categoryLabels = {
            breakfast: 'Breakfast Menu',
            brunch: 'Brunch Special',
            lunch: 'Lunch Selection',
            dinner: 'Main Dinner Menu',
            drinks: 'Wine & Cocktails',
            cocktails: 'Cocktails & Spirits',
            wine: 'Fine Wine List',
            desserts: 'Desserts & Coffee',
            kids: 'Kids Favorites',
            roomService: 'Room Service',
            allDay: 'All Day Dining'
          };
          const categoryIcons = {
            breakfast: '🍳',
            brunch: '🥞',
            lunch: '🍔',
            dinner: '🍽',
            drinks: '🍹',
            cocktails: '🍷',
            wine: '🍾',
            desserts: '🍰',
            kids: '🎈',
            roomService: '🛏',
            allDay: '🕒'
          };
          const catLabel = categoryLabels[menu.category] || 'Menu';
          const catIcon = categoryIcons[menu.category] || '✦';
          
          return `
            <a href="preview.html?id=${menu.id}&hotelId=${hotelId}&guest=true" class="portal-luxury-card" style="text-decoration: none;">
              <div class="portal-luxury-card__glare"></div>
              <div class="portal-luxury-card__icon-wrap">
                <span class="portal-luxury-card__icon">${catIcon}</span>
              </div>
              <div class="portal-luxury-card__content">
                <span class="portal-luxury-card__category">${catLabel}</span>
                <h3 class="portal-luxury-card__title">${escapeHtml(menu.name)}</h3>
              </div>
              <div class="portal-luxury-card__action">
                <span class="portal-luxury-card__btn">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                </span>
              </div>
            </a>
          `;
        }).join('');

        container.innerHTML = `
          <div class="portal-luxury-wrapper">
            <div class="portal-luxury-container">
              <header class="portal-luxury-header">
                <div class="portal-luxury-logo-wrap ${portalData.hotelLogo ? 'has-logo' : 'has-placeholder'}">
                  ${logoHtml}
                </div>
                <h1 class="portal-luxury-title">${escapeHtml(portalData.hotelName)}</h1>
                ${portalData.hotelAddress ? `
                  <div class="portal-luxury-address">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
                    <span>${escapeHtml(portalData.hotelAddress)}</span>
                  </div>
                ` : ''}
                <div class="portal-luxury-divider">
                  <span class="portal-luxury-divider-line"></span>
                  <span class="portal-luxury-divider-diamond">✦</span>
                  <span class="portal-luxury-divider-line"></span>
                </div>
                <p class="portal-luxury-subtitle">Experience our culinary creations</p>
              </header>
              
              <main class="portal-luxury-grid">
                ${menuCards}
              </main>
              
              <footer class="portal-luxury-footer">
                <p>Welcome • Please select a menu</p>
                <div style="margin-top:20px; font-size:10px; opacity:0.6; letter-spacing:0.1em; text-transform:uppercase;">
                  Powered by <span style="color:var(--accent); font-weight:600;">MenuForge</span>
                </div>
              </footer>
            </div>
          </div>
        `;

        container.classList.remove('hidden');
        if (window.hideSplashScreen) window.hideSplashScreen();
      } catch (error) {
        console.error('Failed to load hotel portal:', error);
        const container = document.getElementById('preview-container');
        container.innerHTML = `
          <div style="text-align:center; padding:48px 24px;">
            <h2 style="font-size:24px;margin-bottom:8px; color: #FFF;">Error Loading Portal</h2>
            <p style="color:var(--text-muted);">${error.message}</p>
          </div>
        `;
        container.classList.remove('hidden');
        if (window.hideSplashScreen) window.hideSplashScreen();
      }
    }

    async function setupGuestSwitcher(hotelId, currentMenuId) {
      if (!isGuest) return;
      try {
        const portalData = await db.get(`publicMenus/hotel_${hotelId}`);
        if (!portalData) return;

        const backHref = hostSlug ? 'preview.html?guest=true' : `preview.html?hotelId=${hotelId}&guest=true`;

        // Render back button to hotel portal
        const existingBack = document.querySelector('.guest-portal-back-btn');
        if (existingBack) existingBack.remove();

        const backBtn = document.createElement('a');
        backBtn.href = backHref;
        backBtn.className = 'guest-portal-back-btn';
        backBtn.innerHTML = `
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block; vertical-align:middle; margin-right:4px;"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
          <span>All Menus</span>
        `;
        document.body.appendChild(backBtn);

        // Render menu switcher only if there are multiple active menus
        if (portalData.menus && portalData.menus.length > 1) {
          const existing = document.querySelector('.guest-menu-switcher');
          if (existing) existing.remove();

          const switcher = document.createElement('div');
          switcher.className = 'guest-menu-switcher';
          
          const currentMenu = portalData.menus.find(m => m.id === currentMenuId);
          const currentName = currentMenu ? currentMenu.name : 'Menus';

          const dropdownItemsHtml = portalData.menus.map(menu => {
            const isActive = menu.id === currentMenuId;
            return `
              <a href="preview.html?id=${menu.id}&guest=true" class="guest-switcher-item ${isActive ? 'guest-switcher-item--active' : ''}">
                <span>${escapeHtml(menu.name)}</span>
              </a>
            `;
          }).join('');

          switcher.innerHTML = `
            <button class="guest-switcher-btn" id="guest-menu-select-btn">
              <span>${escapeHtml(currentName)}</span>
              <svg width="12" height="12" viewBox="0 0 20 20" fill="none" style="margin-left: 4px;"><path d="M5 7.5l5 5 5-5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div class="guest-switcher-dropdown" id="guest-menu-dropdown-menu">
              ${dropdownItemsHtml}
              <div style="height:1px; background: rgba(255,255,255,0.1); margin: 4px 0;"></div>
              <a href="${backHref}" class="guest-switcher-item" style="color: var(--accent); font-weight: 500;">
                <span>🏠 All Menus</span>
              </a>
            </div>
          `;

          document.body.appendChild(switcher);

          const btn = switcher.querySelector('#guest-menu-select-btn');
          const dropdown = switcher.querySelector('#guest-menu-dropdown-menu');

          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdown.classList.toggle('guest-switcher-dropdown--visible');
          });

          document.addEventListener('click', () => {
            dropdown.classList.remove('guest-switcher-dropdown--visible');
          });
        }
      } catch (err) {
        console.error('Failed to setup menu switcher:', err);
      }
    }

    // Init
    if (hostSlug) {
      try {
        const resolvedHotelId = await db.get(`slugs/${hostSlug}`);
        if (resolvedHotelId) {
          if (menuId) {
            loadMenu();
          } else {
            const portalData = await db.get(`publicMenus/hotel_${resolvedHotelId}`);
            if (portalData) {
              updateSplashFromPortalData(portalData);
            }
            loadHotelPortal(resolvedHotelId);
          }
        } else {
          const container = document.getElementById('preview-container');
          container.innerHTML = `
            <div style="text-align:center; padding:48px 24px;">
              <h2 style="font-size:24px;margin-bottom:8px; color: #FFF;">Property Not Found</h2>
              <p style="color:var(--text-muted);">The subdomain "${hostSlug}" is not registered on MenuForge.</p>
            </div>
          `;
          container.classList.remove('hidden');
          if (window.hideSplashScreen) window.hideSplashScreen();
        }
      } catch (err) {
        console.error('Failed to resolve subdomain:', err);
        const container = document.getElementById('preview-container');
        container.innerHTML = `
          <div style="text-align:center; padding:48px 24px;">
            <h2 style="font-size:24px;margin-bottom:8px; color: #FFF;">Error Loading Property</h2>
            <p style="color:var(--text-muted);">${err.message}</p>
          </div>
        `;
        container.classList.remove('hidden');
        if (window.hideSplashScreen) window.hideSplashScreen();
      }
    } else {
      if (menuId) {
        if (isGuest) {
          loadMenu();
        } else {
          await initApp({
            requiresAuth: true,
            onReady: () => loadMenu()
          });
        }
      } else if (hotelIdParam) {
        db.get(`publicMenus/hotel_${hotelIdParam}`).then(portalData => {
          if (portalData) updateSplashFromPortalData(portalData);
        }).catch(err => console.error('Failed to pre-load splash brand:', err));

        loadHotelPortal(hotelIdParam);
      } else {
        navigateTo('dashboard.html');
      }
    }

    // ── Controls ──
    document.getElementById('btn-export-pdf')?.addEventListener('click', () => {
      ExportManager.printPDF();
    });

    document.getElementById('btn-export-png')?.addEventListener('click', () => {
      const container = document.getElementById('preview-container');
      if (container) {
        const cleanName = (menuData?.meta?.name || 'menu').replace(/\s+/g, '_');
        ExportManager.exportPNG(container, cleanName);
      }
    });

    document.getElementById('btn-export-svg')?.addEventListener('click', () => {
      const container = document.getElementById('preview-container');
      if (container) {
        const cleanName = (menuData?.meta?.name || 'menu').replace(/\s+/g, '_');
        ExportManager.exportSVG(container, cleanName);
      }
    });

    document.getElementById('btn-export-csv')?.addEventListener('click', () => {
      if (menuData) {
        ExportManager.exportCSV(menuData, `${menuData.meta?.name || 'menu'}-items.csv`);
      }
    });

    document.getElementById('btn-publish')?.addEventListener('click', async () => {
      const { showShareModal } = await import('./js/app.js');
      await showShareModal(menuId);
    });

    // QR downloads
    document.getElementById('btn-download-qr')?.addEventListener('click', () => {
      const url = QRGenerator.buildMenuUrl(menuId, hotelSubdomain);
      QRGenerator.download(url, `${menuData?.meta?.name || 'menu'}-qr.png`);
    });

    document.getElementById('btn-copy-link')?.addEventListener('click', async () => {
      const url = QRGenerator.buildMenuUrl(menuId, hotelSubdomain);
      try {
        await navigator.clipboard.writeText(url);
        toast.success('Link copied to clipboard');
      } catch {
        toast.error('Failed to copy link');
      }
    });

    // Device preview
    document.querySelectorAll('[data-device]').forEach(btn => {
      btn.addEventListener('click', () => {
        const device = btn.dataset.device;
        const container = document.getElementById('preview-container');

        container.classList.remove('device-frame--active', 'device-frame--phone', 'device-frame--tablet');

        document.querySelectorAll('[data-device]').forEach(b => b.classList.remove('btn--active'));
        btn.classList.add('btn--active');

        if (device !== 'desktop') {
          container.classList.add('device-frame', 'device-frame--active', `device-frame--${device}`);
        }
        
        // Recalculate layout/pagination for the new device size
        updatePreviewLayout();
      });
    });

    // Handle window resizing and document load events for pagination stability
    let resizeTimeout;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(updatePreviewLayout, 200);
    });

    window.addEventListener('load', updatePreviewLayout);
  </script>
</body>
</html>
